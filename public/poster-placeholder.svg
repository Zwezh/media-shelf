  <text x="96" y="63" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">— Library Gallery</text>
  <text x="96" y="250" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">POSTER UNAVAILABLE</text>
