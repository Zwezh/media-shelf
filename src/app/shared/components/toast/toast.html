<article
  class="toast"
  [class.toast--error]="toast().type === 'error'"
  [class.toast--info]="toast().type === 'info'"
  [class.toast--success]="toast().type === 'success'"
  [class.toast--warning]="toast().type === 'warning'"
  [attr.role]="role()"
  aria-atomic="true"
>
  <span class="toast__icon" aria-hidden="true">{{ icon() }}</span>

  <span class="toast__content">
    <strong class="toast__title">{{ toast().title }}</strong>
    @if (toast().message) {
      <span class="toast__message">{{ toast().message }}</span>
    }
  </span>

  @if (toast().action || toast().closable) {
    <span class="toast__actions">
      @if (toast().action; as action) {
        <button class="toast__action" type="button" (click)="activateAction()">{{ action.label }}</button>
      }
      @if (toast().closable) {
        <button class="toast__close" type="button" [attr.aria-label]="'common.dismissNotification' | translate" (click)="dismiss()">
          <span aria-hidden="true">×</span>
        </button>
      }
    </span>
  }
</article>
