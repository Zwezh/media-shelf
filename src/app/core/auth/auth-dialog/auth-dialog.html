<section class="auth-dialog">
  <header class="auth-dialog__header">
    <div class="auth-dialog__identity">
      <span class="auth-dialog__logo" aria-hidden="true">
        <img ngSrc="logo.svg" width="40" height="40" alt="" />
      </span>
      <div>
        <h2 id="auth-dialog-title">{{ 'auth.dialog.title' | translate }}</h2>
        <p id="auth-dialog-description">{{ 'auth.dialog.description' | translate }}</p>
      </div>
    </div>
    <button
      class="btn btn-icon btn-ghost auth-dialog__close"
      type="button"
      [disabled]="isSubmitting()"
      [attr.aria-label]="'common.close' | translate"
      (click)="close()"
    >
      <span aria-hidden="true">×</span>
    </button>
  </header>

  <form (submit)="signIn($event)">
    <div class="auth-dialog__body">
      <label class="form-label" for="auth-secret-key">{{ 'auth.dialog.secretKey' | translate }}</label>
      <div class="auth-dialog__secret-field">
        <msh-icon name="key" [size]="18" />
        <input
          #secretKeyInput
          id="auth-secret-key"
          class="form-control"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          [type]="showSecret() ? 'text' : 'password'"
          [formField]="credentialsForm.secretKey"
          [attr.aria-describedby]="
            credentialsForm.secretKey().invalid() ? 'auth-secret-key-error auth-secret-key-hint' : 'auth-secret-key-hint'
          "
        />
        <button
          class="btn btn-icon btn-ghost auth-dialog__visibility"
          type="button"
          [attr.aria-label]="(showSecret() ? 'auth.dialog.hideSecret' : 'auth.dialog.showSecret') | translate"
          (click)="toggleSecretVisibility()"
        >
          <msh-icon [name]="showSecret() ? 'visibility-off' : 'visibility'" [size]="18" />
        </button>
      </div>
      <msh-form-validation-message [field]="credentialsForm.secretKey()" messageId="auth-secret-key-error" />
      <p id="auth-secret-key-hint" class="auth-dialog__hint">
        <msh-icon name="shield" [size]="16" />
        {{ 'auth.dialog.hint' | translate }}
      </p>
    </div>

    <footer class="auth-dialog__footer">
      <button class="btn btn-secondary" type="button" [disabled]="isSubmitting()" (click)="close()">
        {{ 'common.cancel' | translate }}
      </button>
      <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">
        <msh-icon name="login" [size]="18" />
        {{ (isSubmitting() ? 'auth.actions.signingIn' : 'auth.actions.signIn') | translate }}
      </button>
    </footer>
  </form>
</section>
